keystone:
  title: Dualys for SME / Large corporations Tier 1-2-3
  missionLabel: Mission
  mission: >-
    Dualys drives the growth of industrial and technology companies in the
    Aerospace, Security and Defence (ASD) market by connecting them with real
    opportunities for dual-use development. We help you become ASD-ready through
    structured qualification, a proven methodology, technical audits to support
    future certifications, and strategic guidance.
  text: >-
    Our approach is powered by KEYSTONE, Dualys’ proprietary Business
    Intelligence platform, providing unique visibility into the Spanish Defence,
    Security and Aerospace market, key players, opportunities and industrial
    ecosystem. We provide the intelligence, prepare, position and connect your
    business with the right buyers.
