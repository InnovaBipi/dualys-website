cta: Hablemos
keystone:
  title: Dualys para primes y contratistas
  missionLabel: Misión
  mission: >-
    Apoyamos a los equipos de Compras y Cadena de Suministro en la
    identificación, evaluación y cualificación de proveedores industriales
    fiables y con capacidad técnica, para reforzar la resiliencia de la cadena
    de suministro, mitigar el riesgo de aprovisionamiento y aumentar la
    confianza en la ejecución de los programas.
  text: >-
    Nuestro enfoque se apoya en KEYSTONE, la plataforma propia de Business
    Intelligence de Dualys, que combina inteligencia industrial con la
    identificación y cualificación estructuradas de proveedores para dar a los
    equipos de Compras una visibilidad más profunda sobre el ecosistema
    industrial catalán dual-use y preparado para la defensa.
