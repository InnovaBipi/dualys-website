meta:
  title: Per a Grans Primes i Integradors | Proveïdors Qualificats | Dualys
  description: >-
    Amplia la teva cadena de subministrament amb proveïdors industrials i
    tecnològics qualificats de l'ecosistema català i espanyol.
title: Amplia la teva cadena de subministrament amb capacitat local qualificada
subtitle: >-
  Accedeix a un ecosistema de proveïdors industrials i tecnològics espanyols,
  amb capacitats transferibles ja identificades i qualificades per Dualys.
valueProps:
  - text: Base de proveïdors pre-qualificats per perfil i vertical
  - text: Reducció de risc en cadena de subministrament
  - text: Accés a capacitats innovadores d'origen europeu
cta: Parlem
keystone:
  title: Dualys per a primes i contractistes
  missionLabel: Missió
  mission: >-
    Donem suport als equips de Compres i Cadena de Subministrament en la
    identificació, l'avaluació i la qualificació de proveïdors industrials
    fiables i amb capacitat tècnica, per reforçar la resiliència de la cadena de
    subministrament, mitigar el risc d'aprovisionament i augmentar la confiança
    en l'execució dels programes.
  text: >-
    El nostre enfocament es basa en KEYSTONE, la plataforma pròpia de Business
    Intelligence de Dualys, que combina intel·ligència industrial amb la
    identificació i la qualificació estructurades de proveïdors per oferir als
    equips de Compres una visió més profunda de l'ecosistema industrial català
    dual-use i preparat per a la defensa.
