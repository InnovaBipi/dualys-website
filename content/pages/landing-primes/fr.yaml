  description: Élargissez votre chaîne d'approvisionnement avec des fournisseurs industriels et technologiques qualifiés de l'écosystème catalan et espagnol.
title: Élargissez votre chaîne d'approvisionnement avec des capacités locales qualifiées
subtitle: Accédez à un écosystème de fournisseurs industriels et technologiques espagnols, avec des capacités transférables déjà identifiées et qualifiées par DUALYS.
valueProps:
  - text: Base de fournisseurs pré-qualifiés par profil et verticale
  - text: Réduction du risque dans la chaîne d'approvisionnement
  - text: Accès à des capacités innovantes d'origine européenne
cta: Parlons-en
keystone:
  title: Dualys pour les donneurs d'ordre et les maîtres d'œuvre
  missionLabel: Mission
  mission: >-
    Nous accompagnons les équipes Achats et Supply Chain dans l'identification,
    l'évaluation et la qualification de fournisseurs industriels fiables et
    techniquement compétents, afin de renforcer la résilience de la chaîne
    d'approvisionnement, de réduire les risques d'approvisionnement et
    d'accroître la confiance dans l'exécution des programmes.
  text: >-
    Notre approche s'appuie sur KEYSTONE, la plateforme propriétaire de Business
    Intelligence de Dualys, qui combine l'intelligence industrielle avec
    l'identification et la qualification structurées des fournisseurs pour
    offrir aux équipes Achats une visibilité approfondie sur l'écosystème
    industriel catalan, dual-use et prêt pour la défense.
