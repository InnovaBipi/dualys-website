keystone:
  title: Dualys para pymes y grandes empresas Tier 1-2-3
  missionLabel: Misión
  mission: >-
    Dualys impulsa el crecimiento de empresas industriales y tecnológicas en el
    mercado aeroespacial, de seguridad y defensa (ASD), conectándolas con
    oportunidades reales de desarrollo dual-use. Te ayudamos a preparar tu
    empresa para el mercado ASD con una cualificación estructurada, una
    metodología probada, auditorías técnicas de cara a futuras certificaciones y
    orientación estratégica.
  text: >-
    Nuestro enfoque se apoya en KEYSTONE, la plataforma propia de Business
    Intelligence de Dualys, que ofrece una visibilidad única sobre el mercado
    español aeroespacial, de seguridad y defensa, sus actores clave, sus
    oportunidades y su ecosistema industrial. Aportamos la inteligencia,
    preparamos y posicionamos tu empresa y la conectamos con los compradores
    adecuados.
