cta: Sol·licita el teu diagnòstic
keystone:
  title: Dualys per a pimes i grans empreses Tier 1-2-3
  missionLabel: Missió
  mission: >-
    Dualys impulsa el creixement d'empreses industrials i tecnològiques al
    mercat aeroespacial, de seguretat i defensa (ASD) connectant-les amb
    oportunitats reals de desenvolupament dual-use. T'ajudem a preparar la teva
    empresa per al mercat ASD amb una qualificació estructurada, una metodologia
    provada, auditories tècniques que donen suport a futures certificacions i
    orientació estratègica.
  text: >-
    El nostre enfocament es basa en KEYSTONE, la plataforma pròpia de Business
    Intelligence de Dualys, que ofereix una visió única del mercat espanyol
    aeroespacial, de seguretat i defensa, dels seus actors clau, de les seves
    oportunitats i del seu ecosistema industrial. Aportem la intel·ligència,
    preparem i posicionem la teva empresa i la connectem amb els compradors
    adequats.
