keystone:
  title: Dualys pour les PME et grandes entreprises Tier 1-2-3
  missionLabel: Mission
  mission: >-
    Dualys accélère la croissance des entreprises industrielles et
    technologiques sur le marché de l'aérospatiale, de la sécurité et de la
    défense (ASD) en les connectant à de réelles opportunités de développement
    dual-use. Nous vous aidons à vous préparer au marché ASD grâce à une
    qualification structurée, une méthodologie éprouvée, des audits techniques
    en vue de futures certifications et un accompagnement stratégique.
  text: >-
    Notre approche s'appuie sur KEYSTONE, la plateforme propriétaire de Business
    Intelligence de Dualys, qui offre une visibilité unique sur le marché
    espagnol de la défense, de la sécurité et de l'aérospatiale, ses acteurs
    clés, ses opportunités et son écosystème industriel. Nous apportons
    l'intelligence économique, préparons et positionnons votre entreprise, et la
    mettons en relation avec les bons acheteurs.
